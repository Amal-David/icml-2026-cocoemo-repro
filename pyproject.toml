[project]
name = "cocoemo"
version = "0.1.0"
description = "CoCoEmo: Composable and Controllable Human-Like Emotional TTS via Activation Steering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Siyi Wang", email = "siyi.wang.4@student.unimelb.edu.au" },
]

# Core deps only (backbone-specific deps are in env/*.txt).
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "numpy>=1.26,<2.3",
    "pandas==2.3.3",
    "pyyaml>=6.0.2",
    "scikit-learn==1.7.2",
    "tqdm==4.67.3",
    "funasr==1.2.6",
]

[project.optional-dependencies]
cosyvoice2 = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "huggingface-hub>=0.30,<1.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "modelscope==1.20.0",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.23.2; sys_platform == 'linux'",
    "openai-whisper==20231117",
    "protobuf>=4.25,<5",
    "pyworld==0.3.4",
    "soundfile==0.12.1",
    "tokenizers>=0.21,<0.22",
    "transformers==4.51.3",
    "wetext==0.0.4",
    "wget==3.2",
    "x-transformers==2.11.24",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[project.urls]
Homepage = "https://github.com/wsssy/CoCoEmo"

[tool.setuptools.packages.find]
include = ["cocoemo*", "repro*", "study*"]

[tool.uv.extra-build-dependencies]
# The pinned upstream Whisper release imports pkg_resources while building.
openai-whisper = ["setuptools<81"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
