[project]
name = "cocoemo"
version = "0.1.0"
description = "CoCoEmo: Composable and Controllable Human-Like Emotional TTS via Activation Steering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Siyi Wang", email = "siyi.wang.4@student.unimelb.edu.au" },
]

# Core deps only (backbone-specific deps are in env/*.txt).
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "numpy>=1.26,<2.3",
    "pandas==2.3.3",
    "pyyaml>=6.0.2",
    "scikit-learn==1.7.2",
    "tqdm==4.67.3",
]

[project.urls]
Homepage = "https://github.com/wsssy/CoCoEmo"

[tool.setuptools.packages.find]
include = ["cocoemo*", "repro*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
